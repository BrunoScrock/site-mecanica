<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img" aria-label="INOVE Mecânica">
  <defs>
    <style>
      .inove-word { font-family: 'Bebas Neue', 'Arial Narrow', sans-serif; font-weight: 400; font-size: 46px; letter-spacing: 3px; fill: #FFFFFF; }
      .inove-sub  { font-family: 'Rajdhani', 'Arial', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 8px; fill: #D71920; }
    </style>
  </defs>
  <rect x="0" y="0" width="240" height="120" fill="#080808"/>
  <!-- engrenagem -->
  <g>
    <circle cx="40" cy="60" r="24" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <g transform="rotate(0 40 60)"><rect x="36.5" y="25.5" width="7" height="10" rx="2" fill="#FFFFFF"/></g>
    <g transform="rotate(45 40 60)"><rect x="36.5" y="25.5" width="7" height="10" rx="2" fill="#FFFFFF"/></g>
    <g transform="rotate(90 40 60)"><rect x="36.5" y="25.5" width="7" height="10" rx="2" fill="#FFFFFF"/></g>
    <g transform="rotate(135 40 60)"><rect x="36.5" y="25.5" width="7" height="10" rx="2" fill="#FFFFFF"/></g>
    <g transform="rotate(180 40 60)"><rect x="36.5" y="25.5" width="7" height="10" rx="2" fill="#FFFFFF"/></g>
    <g transform="rotate(225 40 60)"><rect x="36.5" y="25.5" width="7" height="10" rx="2" fill="#FFFFFF"/></g>
    <g transform="rotate(270 40 60)"><rect x="36.5" y="25.5" width="7" height="10" rx="2" fill="#FFFFFF"/></g>
    <g transform="rotate(315 40 60)"><rect x="36.5" y="25.5" width="7" height="10" rx="2" fill="#FFFFFF"/></g>
    <circle cx="40" cy="60" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
    <circle cx="40" cy="60" r="7" fill="#D71920"/>
  </g>
  <!-- texto -->
  <text class="inove-word" x="82" y="58">INOVE</text>
  <text class="inove-sub" x="86" y="88">MECÂNICA</text>
  <rect x="86" y="96" width="60" height="3" fill="#D71920"/>
</svg>